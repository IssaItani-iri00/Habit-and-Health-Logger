<!DOCTYPE html>

<html>
    <head>
        <meta charset = "UTF-8">
        <title>Admin Page</title>
        <link rel = "stylesheet" href = "admin-page.css">
    </head>

    <body>
         <nav class = "navbar">
            <div class = "nav-brand">
                <img src = "../../images/health-logo.png" alt = "Habit Logger" class = "nav-logo">
                <span class = "nav-title">Habit Logger</span>
            </div>
            <div class = "nav-links">
                <a href = "admin-page.html" class = "nav-link active">Users</a>
            </div>
            <div class = "nav-user">
                <img src = "../../images/pfp-img.jpg" alt = "User" class = "user-avatar" id = "userAvatar">
                <div class = "dropdown-menu" id = "dropdownMenu">
                    <button class = "dropdown-item" id = "logoutBtn">Logout</button>
                </div>
            </div>
        </nav>
        <div class = "container">
            <h1 class = "page-title">User Management</h1>
            <div class = "table-container">
                <table class = "users-table" id = "usersTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id = "usersTableBody">
                        <tr>
                            <td colspan="5">Loading users...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <script src = "../../scripts/axios.min.js"></script>
        <script src = "admin-page.js"></script>
    </body>
</html>
